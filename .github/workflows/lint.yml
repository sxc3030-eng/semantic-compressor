name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Show ruff version
        run: ruff --version

      - name: Run ruff check
        # Soft check at first: surface findings in the logs without blocking PRs.
        # Flip continue-on-error to false once the codebase is clean.
        continue-on-error: true
        run: |
          ruff check src/ tests/ examples/ --output-format=github

      - name: Run ruff format check (informational)
        continue-on-error: true
        run: |
          ruff format --check src/ tests/ examples/
